---
- name: Write the kubeadm control-plane configuration
  ansible.builtin.template:
    src: kubeadm-init.yml.j2
    dest: /etc/kubernetes/kubeadm-init.yml
    owner: root
    group: root
    mode: "0600"

- name: Check whether the control plane is initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: kubernetes_admin_conf

- name: Initialize the Kubernetes control plane
  ansible.builtin.command: kubeadm init --config /etc/kubernetes/kubeadm-init.yml
  when: not kubernetes_admin_conf.stat.exists
  changed_when: true

- name: Create the administrator's kubeconfig directory
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"

- name: Install the administrator's kubeconfig
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    remote_src: true
    dest: "/home/{{ ansible_user }}/.kube/config"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"

- name: Create a short-lived worker bootstrap token
  ansible.builtin.command: kubeadm token create --ttl 2h --print-join-command
  register: kubernetes_join_command
  changed_when: false
  no_log: true

- name: Record worker discovery credentials
  ansible.builtin.set_fact:
    kubernetes_join_token: >-
      {{ kubernetes_join_command.stdout |
         regex_findall('--token[ ]+([^ ]+)') | first }}
    kubernetes_discovery_ca_hash: >-
      {{ kubernetes_join_command.stdout |
         regex_findall('--discovery-token-ca-cert-hash[ ]+([^ ]+)') | first }}
  no_log: true

