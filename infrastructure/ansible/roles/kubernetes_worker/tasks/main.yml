---
- name: Check whether the worker is already joined
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubernetes_kubelet_conf

- name: Write the short-lived kubeadm worker configuration
  ansible.builtin.template:
    src: kubeadm-join.yml.j2
    dest: /etc/kubernetes/kubeadm-join.yml
    owner: root
    group: root
    mode: "0600"
  when: not kubernetes_kubelet_conf.stat.exists
  no_log: true

- name: Join the worker to the cluster
  ansible.builtin.command: kubeadm join --config /etc/kubernetes/kubeadm-join.yml
  when: not kubernetes_kubelet_conf.stat.exists
  changed_when: true
  no_log: true

- name: Remove the worker bootstrap credentials
  ansible.builtin.file:
    path: /etc/kubernetes/kubeadm-join.yml
    state: absent

