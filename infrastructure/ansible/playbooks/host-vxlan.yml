---
- name: Build a shared hypervisor VXLAN LAN for native-routing VMs
  hosts: hypervisors
  become: true
  gather_facts: false
  vars:
    host_vxlan_inner_mtu: "{{ experiment_inner_mtu | default(1500) | int }}"
    host_vxlan_outer_mtu: "{{ host_vxlan_inner_mtu | int + 50 }}"
  tasks:
    - name: Inspect the preconfigured experiment underlay
      ansible.builtin.command:
        argv: [ip, -j, address, show, dev, '{{ vxlan_underlay_interface }}']
      register: host_vxlan_link
      changed_when: false

    - name: Require an addressed underlay large enough for VXLAN and unique VTEPs
      ansible.builtin.assert:
        that:
          - (host_vxlan_link.stdout | from_json)[0].mtu | int >= host_vxlan_outer_mtu | int
          - vxlan_underlay_ipv4 in ((host_vxlan_link.stdout | from_json)[0].addr_info | map(attribute='local') | list)
          - groups['hypervisors'] | length >= 2
          - groups['hypervisors'] | map('extract', hostvars, 'vxlan_underlay_ipv4') | unique | length == groups['hypervisors'] | length
        fail_msg: >-
          Configure unique experiment underlay IPv4 addresses and
          MTU >= {{ host_vxlan_outer_mtu }} first.

    - name: Verify full-sized underlay packets reach every hypervisor
      ansible.builtin.command:
        argv: [ping, -n, -I, '{{ vxlan_underlay_interface }}', -M, do, -s, '{{ host_vxlan_outer_mtu | int - 28 }}', -c, '1', -W, '3', '{{ hostvars[item].vxlan_underlay_ipv4 }}']
      loop: "{{ groups['hypervisors'] | difference([inventory_hostname]) }}"
      changed_when: false

    - name: Write persistent shared VXLAN setup
      ansible.builtin.template:
        src: ../templates/host-vxlan.sh.j2
        dest: /usr/local/sbin/cs740-host-vxlan
        owner: root
        group: root
        mode: '0755'

    - name: Install shared VXLAN service
      ansible.builtin.copy:
        dest: /etc/systemd/system/cs740-host-vxlan.service
        mode: '0644'
        content: |
          [Unit]
          Description=CS740 hypervisor VXLAN bridge
          Wants=network-online.target
          After=network-online.target
          Before=libvirtd.service
          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/usr/local/sbin/cs740-host-vxlan
          [Install]
          WantedBy=multi-user.target

    - name: Reconcile shared VXLAN bridge
      ansible.builtin.systemd_service:
        name: cs740-host-vxlan
        enabled: true
        state: restarted
        daemon_reload: true
